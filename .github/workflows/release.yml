name: Cargo Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write     # Required for OIDC token exchange

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: |
          cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

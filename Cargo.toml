[package]
name = "shrincs-rs"
version = "1.1.0"
edition = "2024"
repository = "https://github.com/XuJiandong/shrincs-rs"
description = "Rust implementation of the SHRINCS post-quantum signature scheme"
license = "MIT"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = ["dep:getrandom", "dep:aes"]
wasm-nodejs = ["std", "dep:wasm-bindgen", "getrandom/js"]
wasm-web = [
	"std",
	"dep:rayon",
	"dep:wasm-bindgen",
	"dep:wasm-bindgen-rayon",
	"getrandom/js",
]
kat-tests = []

[dependencies]
ckb-opt-sha256 = "0.1.0"
getrandom = { version = "0.2", optional = true }
aes = { version = "0.8", optional = true }
rayon = { version = "1", optional = true }
wasm-bindgen = { version = "=0.2.108", optional = true }
wasm-bindgen-rayon = { version = "1.3", optional = true }

# Native benchmark mirroring deps/shrincs-cpp/tests/bench.cpp.
# harness = false: plain main() so it runs on stable (no nightly #[bench]).
[[bench]]
name = "bench"
harness = false
